[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dread-engine"
version = "0.1.0"
description = "Deterministic solo horror text engine orchestrated by local open-weight LLMs"
readme = "README.md"
authors = [{ name = "Sri Sudharsanan K" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "textual>=0.70.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
tts = [
    "piper-tts>=1.2.0",
]

[project.scripts]
dread = "dread.cli:main"

[tool.setuptools.packages.find]
include = ["dread*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
